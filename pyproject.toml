[project]
name = "asistente-estudio-ia"
version = "0.1.0"
description = "Asistente de estudio RAG con recuperacion y generacion local"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "pypdf==6.19.0",
    "PyMuPDF==1.26.7",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
    "numpy==2.5.4",
    "sentence-transformers==6.2.0",
    "transformers==5.22.2",
    "huggingface-hub==2.4.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
